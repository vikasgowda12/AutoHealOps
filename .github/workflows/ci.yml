name: AutoHealOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autohealops-backend ./backend

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name autohealops-test autohealops-backend

      - name: Wait for application
        run: sleep 5

      - name: Test health endpoint
        run: curl --fail http://localhost:8000/health

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: vikasgowda12/autohealops-backend:latest