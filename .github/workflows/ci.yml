name: AutoHealOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # BACKEND

      - name: Build backend Docker image
        run: docker build -t autohealops-backend ./backend

      - name: Run backend container
        run: docker run -d -p 8000:8000 --name autohealops-backend-test autohealops-backend

      - name: Wait for backend
        run: sleep 5

      - name: Test backend health endpoint
        run: curl --fail http://localhost:8000/health

      # FRONTEND

      - name: Build frontend Docker image
        run: docker build -t autohealops-frontend ./frontend

      - name: Run frontend container
        run: docker run -d -p 8080:80 --name autohealops-frontend-test autohealops-frontend

      - name: Wait for frontend
        run: sleep 5

      - name: Test frontend
        run: curl --fail http://localhost:8080

      # DOCKER HUB

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: vikasgowda12/autohealops-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: vikasgowda12/autohealops-frontend:latest