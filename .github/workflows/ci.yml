name: AutoHealOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autohealops-backend ./backend

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name autohealops-test autohealops-backend

      - name: Wait for application
        run: sleep 5

      - name: Test health endpoint
        run: curl --fail http://localhost:8000/health